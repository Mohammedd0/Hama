<link rel="stylesheet" href="app.css">
<script>
  /* language: English by default, Kurdish (Sorani) as second language */
  (function () {
    var l = 'en';
    try { l = localStorage.getItem('bite_app_lang') || 'en'; } catch (e) {}
    if (l !== 'ku') l = 'en';
    window.Lang = l;
    document.documentElement.lang = l === 'ku' ? 'ckb' : 'en';
    document.documentElement.dir = l === 'ku' ? 'rtl' : 'ltr';
    window.setLang = function (x) { try { localStorage.setItem('bite_app_lang', x); } catch (e) {} location.reload(); };
  })();
</script>
